name: Job Output workflow
on: push
jobs:
  push_job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci   

      - name: Build project
        run: npm run build   

      - name : Upload artifact # This step uploads the build artifact
        uses: actions/upload-artifact@v4 # This action uploads files to GitHub
        with:
          name: build-artifact # Name of the artifact
          path: | # This specifies the files to include in the artifact
             build/
             dist/
             public/
             package.json
          
  deploy_job:
    runs-on: ubuntu-latest
    needs: push_job # This job depends on the completion of push_job
    steps:
      - name: Download artifact # This step downloads the artifact from the previous job
        uses: actions/download-artifact@v4 # This action downloads files from GitHub
        with:
          name: build-artifact # Name of the artifact to download    
      - name: Output content
        run: ls       # This command lists the contents of the current directory to verify the downloaded files
  
      - name: Deploy application # This step deploys the application
        run: echo "Deploying application..."  