name: Buil Artifact Event
on: push
jobs:
  push_job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci   

      - name: Build project
        run: npm run build   

      - name : Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: dist