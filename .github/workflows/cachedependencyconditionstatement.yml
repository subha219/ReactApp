name: Cache Dependency condition statement Example
on: push
jobs:
  push_job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Cache Dependency
        uses: actions/cache@v3
        id: cache-node-modules 
        with:
          path: ~/.npm
          key: deps-node-module-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true' # a "cache hit" refers to the successful retrieval of previously saved files or dependencies from the cache.
        run: npm ci   

      - name: Build project
        run: npm run build
          
  deploy_job:
    runs-on: ubuntu-latest
    needs: push_job
    steps:
      - name: Cache Dependency
        uses: actions/cache@v3
        id: cache-node-modules 
        with:
          path: ~/.npm
          key: deps-node-module-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit == 'true' # a "cache hit" refers to the successful retrieval of previously saved files or dependencies from the cache.
        run: npm ci  

      - name: Output content
        run: ls      
  
      - name: Deploy application
        run: echo "Deploying application..."  
