name: Activity Type Action Demonstration
on:
  pull_request: # This triggers the workflow on pull request events
    types: # This specifies the types of pull request events to trigger the workflow
      - opened # This triggers on pull request opened events
      - closed # This triggers on pull request closed events
    branches: # This specifies the branches to trigger the workflow on
      - main # This triggers on pushes to the main branch
      - 'dev-*' # This triggers on pushes to any branch starting with 'dev-'
      - 'dev/**' # This triggers on pushes to any branch under 'dev/' hierarchy  
  workflow_dispatch: # This allows manual triggering of the workflow    
  push: # This triggers the workflow on push events
    branches: # This specifies the branches to trigger the workflow on
      - main # This triggers on pushes to the main branch
      - 'dev-*' # This triggers on pushes to any branch starting with 'dev-'
      - 'dev/**' # This triggers on pushes to any branch under 'dev/' hierarchy
jobs:
  push_job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci    