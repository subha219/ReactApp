name: Cache Dependency Example
on: push
jobs:
  push_job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Cache Dependency # This step caches the dependencies to speed up the workflow
        uses: actions/cache@v3 # This action caches dependencies to speed up the workflow
        with:
          path: ~/.npm # Path to cache # This is where npm stores its cache
          key: deps-node-module-${{ hashFiles('**/package-lock.json') }} # Key for the cache # This uses the hash of package-lock.json to create a unique cache key

      - name: Install dependencies
        run: npm ci   

      - name: Build project
        run: npm run build
          
  deploy_job:
    runs-on: ubuntu-latest
    needs: push_job
    steps:
      - name: Cache Dependency # This step caches the dependencies to speed up the workflow
        uses: actions/cache@v3 # This action caches dependencies to speed up the workflow
        with:
          path: ~/.npm # Path to cache # This is where npm stores its cache
          key: deps-node-module-${{ hashFiles('**/package-lock.json') }} # Key for the cache # This uses the hash of package-lock.json to create a unique cache key
      - name: Output content
        run: ls      
  
      - name: Deploy application
        run: echo "Deploying application..."